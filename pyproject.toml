[project]
name = "compiutar-vijan"
version = "0.1.0"
requires-python = "==3.12"
dependencies = [
    "fiftyone>=1.19.0",
    "matplotlib>=3.11.0",
    "more-itertools>=11.1.0",
    "numpy>=1.26.4",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
